<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#68246d">
<meta name="color-scheme" content="light only">
<title>My Timetable</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
html, body {
  touch-action: manipulation;
}
#splash {
  position: fixed;
  inset: 0;
  z-index: 999;
  background: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 1;
  transition: opacity .5s ease;
}
#splash.hide {
  opacity: 0;
  pointer-events: none;
}
#splash img {
  width: min(260px, 60vw);
  height: auto;
}

:root{
  color-scheme:light;
  --bg:#f6f5f2; --panel:#fff; --ink:#1d1d1f; --muted:#6b6b72; --line:#e4e2dd;
  --today:#fff8e6; --accent:#68246d;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
.ev,.row,button{-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:16px 20px;max-width:1200px;margin:0 auto}
h1{font-size:20px;margin:0}
.sub{color:var(--muted);font-size:13px}
.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 12px;font:inherit;cursor:pointer}
button:hover{border-color:var(--accent)}
button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.seg{display:inline-flex}
.seg button{border-radius:0;margin-left:-1px}
.seg button:first-child{border-radius:8px 0 0 8px;margin-left:0}
.seg button:last-child{border-radius:0 8px 8px 0}
main{max-width:1200px;margin:0 auto;padding:0 20px 40px;overflow-x:hidden}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
#next{background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:10px;padding:14px 18px;margin-bottom:12px}
#next .now{font-size:26px;line-height:1.2;font-weight:500}
#next .now b{font-weight:700}
#next .lbl{display:inline-block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#fff;background:var(--accent);border-radius:6px;padding:3px 9px;margin-right:10px;vertical-align:middle;font-weight:700}
#next .when{display:block;font-size:15px;color:var(--muted);font-weight:400;margin-top:4px}
#next .nxt{margin-top:10px;padding-top:8px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
#next .nxt b{font-size:13px;color:var(--ink);font-weight:600}
.nowband{position:absolute;left:0;right:0;z-index:3;pointer-events:none;background:rgba(104,36,109,.10);border-top:2px solid var(--accent);border-bottom:1px solid rgba(104,36,109,.35)}
.hour.nowhour{color:#fff;background:var(--accent);font-weight:700;border-radius:0 6px 6px 0;height:19px;line-height:19px;width:52px;padding-left:6px;z-index:3}
.range{font-weight:600;min-width:200px;text-align:center}
.grid{display:grid;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.colhead{padding:8px 4px;text-align:center;border-bottom:1px solid var(--line);font-weight:600;font-size:13px;background:var(--panel)}
.colhead small{display:block;color:var(--muted);font-weight:400}
.colhead.today{background:var(--today)}
.timecol,.daycol{position:relative}
.daycol{border-left:1px solid var(--line)}
.daycol.today{background:var(--today)}
.hour{position:absolute;left:0;right:0;border-top:1px solid var(--line);font-size:11px;color:var(--muted);padding-left:6px}
.daycol .hour{padding:0}
.plus{font-size:9px;vertical-align:super;margin-left:1px}
.ev{position:absolute;border-radius:8px;padding:5px 7px;font-size:12px;line-height:1.3;overflow:hidden;color:#111;border-left:4px solid rgba(0,0,0,.35);cursor:default}
.ev b{display:block;font-size:12.5px}
.ev .t{opacity:.75}
.ev.revision{border:1px dashed rgba(0,0,0,.28);border-left:4px dashed;background-image:repeating-linear-gradient(135deg,transparent 0 7px,rgba(255,255,255,.55) 7px 14px)}
.ev.tiny{padding:2px 7px;white-space:nowrap;text-overflow:ellipsis}
.ev.tiny b{display:inline;font-size:12px}
.ev.tiny .t,.ev.tiny br{display:none}
.ev.sport{background:#ffe08a !important;border-left-color:#b07d00}
.ev.lunch{background:#ffd3b8 !important;border-left-color:#c2612a}
.ev.call{background:#f9c6dd !important;border-left-color:#c2306b}
.ev.free{background:transparent !important;border:1px dashed var(--line);border-left:4px dashed var(--line);color:var(--muted)}
.ev.free .t{opacity:1}
.list-day{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden}
.list-day h3{margin:0;padding:10px 14px;font-size:14px;border-bottom:1px solid var(--line)}
.list-day.today h3{background:var(--today)}
.row{display:flex;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .time{width:130px;color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11px;color:#111;margin-left:6px}
.empty{padding:30px;text-align:center;color:var(--muted)}

/* Interactive Legend & Filters */
.legend{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12.5px;color:var(--muted);margin:14px 0 0}
.filter-chip{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:5px 10px;
  border-radius:20px;
  border:1px solid var(--line);
  background:var(--panel);
  font:inherit;
  font-size:12.5px;
  color:var(--ink);
  cursor:pointer;
  user-select:none;
  transition:all .15s ease;
  min-height:auto;
}
.filter-chip:hover{border-color:var(--accent)}
.filter-chip.off{
  opacity:.45;
  background:transparent;
  border-color:var(--line);
  text-decoration:line-through;
}

.ev,.row[data-i]{cursor:pointer}
.ev:hover,.ev:focus-visible{filter:brightness(.96);outline:2px solid var(--accent);outline-offset:-2px}
.row[data-i]:hover,.row[data-i]:focus-visible{background:rgba(104,36,109,.06);outline:none}
.modal{position:fixed;inset:0;background:rgba(20,20,25,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal[hidden]{display:none}
.sheet{background:#fff;border-radius:16px;max-width:420px;width:100%;padding:18px 18px 16px;position:relative;max-height:88vh;overflow:auto;border-top:8px solid var(--accent);box-shadow:0 12px 40px rgba(0,0,0,.25)}
.sheet h2{margin:0 34px 2px 0;font-size:18px}
.sheet .msub{color:var(--muted);margin-bottom:12px}
.sheet dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:8px 14px}
.sheet dt{color:var(--muted);font-size:13px}
.sheet dd{margin:0;font-weight:500}
#mClose{position:absolute;top:8px;right:8px;width:38px;height:38px;border-radius:50%;padding:0;font-size:22px;line-height:1}
.sw{display:inline-block;width:14px;height:14px;border-radius:4px;border-left:4px solid rgba(0,0,0,.35);vertical-align:middle;margin-right:2px}
#warn{background:#fdecea;color:#7a1d12;border:1px solid #f3b8b0;border-radius:10px;padding:10px 14px;margin-bottom:12px;font-size:13px}
#loader{background:var(--panel);border:2px dashed var(--line);border-radius:12px;padding:28px;text-align:center;margin-bottom:16px}
#zoneNote{max-width:1200px;margin:0 auto;padding:0 20px 10px}
.gridwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:12px}
.gridwrap .grid{min-width:680px}
.gridwrap.day .grid{min-width:0}
button{min-height:38px;touch-action:manipulation}
#view{overflow:hidden;touch-action:pan-y}
#view.wk{touch-action:auto}
html,body{overscroll-behavior-x:none}
.track{display:flex;align-items:flex-start;width:300%;transform:translateX(-33.3333%)}
.panel{flex:0 0 33.3333%;min-width:0}
.panel.side{max-height:var(--h);overflow:hidden}
.gridwrap.day{overflow-x:hidden}
.gridwrap{overscroll-behavior-x:none}
@media (max-width:700px){
  .modal{align-items:flex-end;padding:0}
  .sheet{max-width:none;border-radius:16px 16px 0 0;padding-bottom:calc(18px + env(safe-area-inset-bottom))}
  body{font-size:14px}
  header{padding:12px 14px 8px;gap:8px}
  h1{font-size:18px}
  .controls{width:100%;gap:6px}
  .seg{width:100%}
  .seg button{flex:1}
  #prev,#nextw{flex:none;min-width:46px}
  .range{flex:1 1 calc(100% - 120px);min-width:0;font-size:15px}
  #today,#vday,#vweek,#vlist,#loadbtn{flex:1 1 0;padding:7px 4px;font-size:13px;white-space:nowrap}
  main{padding:0 12px 28px}
  #zoneNote{padding:0 14px 8px;font-size:12px}
  #next{padding:12px 14px}
  #next .now{font-size:21px}
  #next .when{font-size:14px}
  .legend{gap:6px;font-size:12px}
  .row{flex-direction:column;gap:2px}
  .row .time{width:auto}
  .list-day h3{padding:10px 12px}
  .colhead{font-size:14px}
}
</style>
</head>
<body>
<div id="splash"><img src="logo.png" alt="Durham University"></div>
<header>
  <div>
    <h1>My Timetable</h1>
    <div class="sub" id="sub"></div>
  </div>
  <div class="controls">
    <div class="seg" id="zoneSeg" role="group" aria-label="Time zone">
      <button data-z="auto">Auto</button><button data-z="UK">UK</button><button data-z="JP">Japan</button>
    </div>
  </div>
</header>
<div class="sub" id="zoneNote"></div>
<main>
  <div id="loader" hidden>
    <b>Couldn't load <code>timetable.ics</code> automatically.</b>
    <div class="sub" style="margin:6px 0 12px">Opening this page straight from a folder blocks that. Choose your downloaded MyTimetable .ics file, or host the site (e.g. GitHub Pages).</div>
    <button id="pick">Choose .ics file…</button>
  </div>
  <div id="next"></div>
  <div class="toolbar">
    <button id="prev" aria-label="Previous week">&larr;</button>
    <div class="range" id="range"></div>
    <button id="nextw" aria-label="Next week">&rarr;</button>
    <button id="today">Today</button>
    <button id="vday">Day</button>
    <button id="vweek">Week</button>
    <button id="vlist">List</button>
    <button id="loadbtn" title="Load a different .ics file">Load .ics</button>
    <input type="file" id="file" accept=".ics,text/calendar" hidden>
  </div>
  <div id="warn" hidden></div>
  <div class="sub" id="stats" style="margin-bottom:10px"></div>
  <div id="view"></div>
  <div class="legend" id="filterLegend" role="group" aria-label="Toggle event categories">
    <button class="filter-chip" data-kind="class"><i class="sw" style="background:hsl(210 70% 80%)"></i>Class</button>
    <button class="filter-chip" data-kind="revision"><i class="sw" style="background:hsl(210 75% 94%);border:1px dashed rgba(0,0,0,.3);border-left:4px dashed hsl(210 55% 45%)"></i>Revision</button>
    <button class="filter-chip" data-kind="sport"><i class="sw" style="background:#ffe08a;border-left-color:#b07d00"></i>Sport</button>
    <button class="filter-chip" data-kind="lunch"><i class="sw" style="background:#ffd3b8;border-left-color:#c2612a"></i>Lunch</button>
    <button class="filter-chip" data-kind="call"><i class="sw" style="background:#f9c6dd;border-left-color:#c2306b"></i>Call</button>
    <button class="filter-chip" data-kind="free"><i class="sw" style="border:1px dashed var(--muted)"></i>Free period</button>
  </div>
</main>

<div id="modal" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <div class="sheet">
    <button id="mClose" aria-label="Close">&times;</button>
    <div id="mBody"></div>
  </div>
</div>
<script>
(function () {
  const splash = document.getElementById("splash");
  const minTime = new Promise(r => setTimeout(r, 1000));
  const loaded = new Promise(r => document.readyState === "complete" ? r() : window.addEventListener("load", r));
  const safety = new Promise(r => setTimeout(r, 4000));     // never get stuck
  Promise.race([Promise.all([minTime, loaded]), safety]).then(() => {
    splash.classList.add("hide");
    setTimeout(() => splash.remove(), 600);
  });
})();
</script>
<script>
//<planner>
// ---------------------------------------------------------------- time helpers
// "Wall" values are milliseconds computed as if a local clock reading were UTC. UK wall = UK clock time.
const H = 36e5, SLOT = 18e5, DAY = 864e5;
const DAY_START = 9, DAY_END = 17;                    // weekday study/class day: 09:00-17:00 (UK)
const SPORT_DAY = 2, SPORT_START = [13, 0], SPORT_END = [15, 30];   // Wednesday 13:00-15:30
const LUNCH_STARTS = [[12,0],[12,30],[13,0],[11,30],[13,30],[11,0],[14,0]];   // 1h lunch, in order of preference
const CALL_SLOTS = 3;                                   // 1.5 hours
const CALL_DAYS = [0, 2, 3, 5];                        // Mon (0), Wed (2), Thu (3), Sat (5)
const JST_MIDNIGHT_UTC_HOUR = 15;                      // 00:00 in Japan (UTC+9, no DST) = 15:00 UTC
const REVISION_PER_HOUR = 2;                           // hours of revision per timetabled hour
const BEFORE_TYPES = ["tutorial", "seminar", "workshop", "problem class", "test"];   // revision must finish BEFORE these

const W = (y, m, d, h = 0, mi = 0) => Date.UTC(y, m, d, h, mi);
const dayFloor = w => Math.floor(w / DAY) * DAY;
const wd = w => (new Date(w).getUTCDay() + 6) % 7;    // Monday = 0

function lastSunday(year, month1) {                   // month1: 3 or 10 (both have 31 days)
  const base = Date.UTC(year, month1 - 1, 31);
  return base - new Date(base).getUTCDay() * DAY;
}
function ukOffsetUtc(utc) {                           // +1h during BST (last Sun Mar 01:00 UTC -> last Sun Oct 01:00 UTC)
  const y = new Date(utc).getUTCFullYear();
  return (utc >= lastSunday(y, 3) + H && utc < lastSunday(y, 10) + H) ? 1 : 0;
}
const wallToUtc = w => w - ukOffsetUtc(w - H) * H;    // UK wall -> real instant
const utcToUkWall = u => u + ukOffsetUtc(u) * H;
const herMidnightUk = day => { const u = day + JST_MIDNIGHT_UTC_HOUR * H; return u + ukOffsetUtc(u) * H; };

// ---------------------------------------------------------------- ICS parsing
function unfold(text) {
  const lines = [];
  for (const raw of text.replace(/\r\n/g, "\n").replace(/\r/g, "\n").split("\n")) {
    if ((raw[0] === " " || raw[0] === "\t") && lines.length) lines[lines.length - 1] += raw.slice(1);
    else lines.push(raw);
  }
  return lines;
}
const unescapeIcs = v => v.replace(/\\n/g, "\n").replace(/\\N/g, "\n").replace(/\\,/g, ",").replace(/\\;/g, ";").replace(/\\\\/g, "\\");
function parseDt(value) {
  const m = /^(\d{4})(\d\d)(\d\d)T(\d\d)(\d\d)(\d\d)(Z?)$/.exec(value.trim());
  if (!m) throw new Error("unsupported date " + value);
  const w = W(+m[1], +m[2] - 1, +m[3], +m[4], +m[5]);
  return m[7] ? utcToUkWall(w) : w;                    // a trailing Z means UTC; convert to UK clock time
}
function makeEvent(raw) {
  const summary = unescapeIcs(raw.SUMMARY || "");
  let code = "", rest = summary;
  const i = summary.indexOf(": ");
  if (i >= 0 && summary.slice(i + 2)) { code = summary.slice(0, i); rest = summary.slice(i + 2); }
  let title = rest, kind = "";
  const j = rest.lastIndexOf(" - ");
  if (j >= 0) { title = rest.slice(0, j); kind = rest.slice(j + 3); }
  return { code: code.trim(), title: title.trim(), type: kind.trim(), location: unescapeIcs(raw.LOCATION || "").trim(),
            sw: parseDt(raw.DTSTART), ew: parseDt(raw.DTEND) };
}
function parseIcs(text) {
  const events = []; let cur = null;
  for (const line of unfold(text)) {
    if (line === "BEGIN:VEVENT") cur = {};
    else if (line === "END:VEVENT") {
      if (cur && cur.DTSTART && cur.DTEND) { try { events.push(makeEvent(cur)); } catch (e) { /* skip all-day / odd events */ } }
      cur = null;
    } else if (cur && line.includes(":")) {
      const k = line.indexOf(":");
      cur[line.slice(0, k).split(";")[0].toUpperCase()] = line.slice(k + 1);
    }
  }
  return events.sort((a, b) => a.sw - b.sw);
}

// ---------------------------------------------------------------- study planner
const isBeforeType = kind => BEFORE_TYPES.some(t => kind.toLowerCase().includes(t));
const daySlots = d => Array.from({ length: (DAY_END - DAY_START) * 2 }, (_, i) => d + DAY_START * H + i * SLOT);
const dayRange = (a, b) => { const r = []; for (let d = a; d <= b; d += DAY) r.push(d); return r; };

function buildPlan(classes) {
  const sessions = classes.map(c => ({ ...c, s: c.sw, e: c.ew, hours: (c.ew - c.sw) / H }));
  if (!sessions.length) return { events: [], warnings: [] };

  const busy = new Set();                             // occupied 30-min slots (class, sport, lunch, call, revision)
  for (const x of sessions) for (let t = x.s; t < x.e; t += SLOT) busy.add(t);

  const firstDay = dayFloor(Math.min(...sessions.map(x => x.s)));
  const lastDay = dayFloor(Math.max(...sessions.map(x => x.e)));
  const firstMonday = firstDay - wd(firstDay) * DAY;
  const lastSun = lastDay + (6 - wd(lastDay) + 14) * DAY;   // revision may run up to 2 weeks past the last class

  // Wednesday sport (a class wins if they clash)
  const sport = [];
  for (const d of dayRange(firstMonday, lastSun)) {
    if (wd(d) !== SPORT_DAY) continue;
    const a = d + SPORT_START[0] * H + SPORT_START[1] * 6e4, b = d + SPORT_END[0] * H + SPORT_END[1] * 6e4;
    let run = null;
    for (let t = a; t < b; t += SLOT) {
      if (busy.has(t)) { if (run !== null) { sport.push([run, t]); run = null; } }
      else { if (run === null) run = t; busy.add(t); }
    }
    if (run !== null) sport.push([run, b]);
  }

  // 1-hour lunch every weekday, reserved BEFORE revision so it takes priority
  const lunch = [];
  for (const d of dayRange(firstMonday - 7 * DAY, lastSun)) {
    if (wd(d) >= 5) continue;
    for (const [h, m] of LUNCH_STARTS) {
      const a = d + h * H + m * 6e4;
      if (!busy.has(a) && !busy.has(a + SLOT)) { busy.add(a); busy.add(a + SLOT); lunch.push([a, a + 2 * SLOT]); break; }
    }
  }

  // 1.5h call at midnight in Japan on Mon, Wed, Thu, Sat
  const calls = [];
  for (const d of dayRange(firstMonday - 7 * DAY, lastSun)) {
    if (!CALL_DAYS.includes(wd(d))) continue;
    const ideal = herMidnightUk(d);
    for (let k = 0; k < 12; k++) {
      const a = ideal + k * SLOT, run = Array.from({ length: CALL_SLOTS }, (_, j) => a + j * SLOT);
      if (run.every(t => !busy.has(t))) { run.forEach(t => busy.add(t)); calls.push([a, a + CALL_SLOTS * SLOT, k]); break; }
    }
  }

  // revision tasks
  const tasks = [];
  for (const x of sessions) {
    const need = Math.round(x.hours * REVISION_PER_HOUR * 2);   // 30-min slots
    if (need <= 0) continue;
    const before = isBeforeType(x.type);
    tasks.push({ sess: x, need, before, label: before ? "Seminar/Tutorial revision" : "Lecture revision" });
  }
  const weekdaySlots = d => daySlots(d).filter(t => !busy.has(t));

  function pick(task) {
    const x = task.sess;
    let wk, we;
    if (task.before) {
      let lo = x.s - 9 * DAY; const hi = x.s;
      lo = Math.max(lo, firstMonday - 7 * DAY);
      const days = dayRange(dayFloor(lo), dayFloor(hi));
      wk = days.filter(d => wd(d) < 5).flatMap(weekdaySlots).filter(t => lo <= t && t + SLOT <= hi);
      we = days.filter(d => wd(d) >= 5).flatMap(daySlots).filter(t => !busy.has(t) && lo <= t && t + SLOT <= hi);
      wk.sort((a, b) => b - a);                         // as late as possible, but before the session
    } else {
      const lo = x.e, hi = x.e + 14 * DAY;
      const days = dayRange(dayFloor(lo), dayFloor(hi));
      wk = days.filter(d => wd(d) < 5).flatMap(weekdaySlots).filter(t => t >= lo);
      we = days.filter(d => wd(d) >= 5).flatMap(daySlots).filter(t => !busy.has(t) && t >= lo);
      wk.sort((a, b) => a - b);                         // soonest after the lecture
    }
    // weekdays first; Saturday before Sunday for the unavoidable overflow
    we.sort((a, b) => ((wd(a) === 6) - (wd(b) === 6)) || (task.before ? b - a : a - b));
    return wk.concat(we);
  }

  const placed = new Map(), warnings = [];
  const order = tasks.map((_, i) => i).sort((i, j) =>
    ((tasks[i].before ? 0 : 1) - (tasks[j].before ? 0 : 1)) || (tasks[i].sess.s - tasks[j].sess.s));
  for (const i of order) {
    const t = tasks[i];
    const chosen = pick(t).filter(c => !busy.has(c)).slice(0, t.need);
    for (const c of chosen) { busy.add(c); placed.set(c, i); }
    if (chosen.length < t.need) warnings.push({ code: t.sess.code, type: t.sess.type, forW: t.sess.s, got: chosen.length / 2, need: t.need / 2 });
  }

  const out = classes.map(c => ({ ...c, kind: "class" }));
  const byTask = new Map();
  for (const [slot, i] of placed) { if (!byTask.has(i)) byTask.set(i, []); byTask.get(i).push(slot); }
  for (const [i, slots] of byTask) {
    slots.sort((a, b) => a - b);
    const t = tasks[i], x = t.sess, runs = [];

  for (const [a, b] of sport) if (active.has(weekOf(a))) out.push(simple("sport", "SPORT", "Sports", "Sport", { sw: a, ew: b }));

const START_H = 8, END_H = 18, PX = 56;

const inZone = utc => zone() === "JP" ? utc + 9 * H : utcToUkWall(utc);        // clock reading (as wall ms) in the chosen zone
const jpWall = utc => utc + 9 * H;

function dayMarkT(w, refDay) { const n = Math.round((dayFloor(w) - refDay) / DAY); return n ? `{${n > 0 ? "+" : ""}${n}}` : ""; }

function layoutDay(list) {      // lay overlapping events side by side

function buildGrid(anchor) {      // anchor = a day (day view) or a Monday (week view)

let scrollMode = "keep";      // where the current week's sideways scroll should sit after a render: keep | start | end
function render() {

}
const KIND_COLOUR = { sport: "#ffe08a", lunch: "#ffd3b8", call: "#f9c6dd", free: "#c9c7c1" };
let lastFocus = null;

function closeInfo() { $("modal").hidden = true; if (lastFocus && lastFocus.focus) lastFocus.focus(); }
$("view").addEventListener("click", e => { const t = e.target.closest("[data-i]"); if (t) openInfo(events[+t.dataset.i]); });

// the track holds [previous | current | next]; sliding it reveals the neighbour, then we re-render centred on it
let sliding = false;

  scrollMode = dir < 0 ? "end" : "start";
  if (view === "day") { dayStart += dir * DAY; weekStart = mondayOf(dayStart); }
  else { weekStart += dir * 7 * DAY; dayStart = weekStart + wd(dayStart) * DAY; }
  render();
}
function step(dir) { if (!sliding) commitSlide(dir, 0, 260); }
function setView(v) {
  if (v === "day" && view !== "day") { const t = todayUk(); dayStart = (t >= weekStart && t < weekStart + 7 * DAY) ? t : weekStart; }
  view = v; store.set("tt-view", v); render();
}
$("prev").onclick = () => step(-1);
$("nextw").onclick = () => step(1);
$("today").onclick = () => { dayStart = todayUk(); weekStart = mondayOf(dayStart); render(); };
$("vday").onclick = () => setView("day");
$("vweek").onclick = () => setView("week");
$("vlist").onclick = () => setView("list");

// Swipe navigation
let touch = null;
const viewEl = $("view");
const centerWrap = () => { const tr = trackEl(); return tr && tr.children[1].querySelector(".gridwrap"); };
viewEl.addEventListener("touchstart", e => {
  if (sliding || e.touches.length !== 1) { touch = null; return; }
  const t = e.touches[0];
  touch = { x: t.clientX, y: t.clientY, dx: 0, lock: null, t0: Date.now(), baseL: 0, baseR: 0 };
  if (view === "week") {
    const gw = centerWrap();
    if (gw) {
      const max = gw.scrollWidth - gw.clientWidth;
      if (gw.scrollLeft > 1) touch.baseL = null;
      if (gw.scrollLeft < max - 1) touch.baseR = null;
    }
  }
}, { passive: true });
viewEl.addEventListener("touchmove", e => {
  if (!touch) return;
  const t = e.touches[0];
  const dx = t.clientX - touch.x, dy = t.clientY - touch.y;
  if (!touch.lock && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) touch.lock = Math.abs(dx) > Math.abs(dy) * 1.2 ? "x" : "y";
  if (touch.lock !== "x") return;
  let pull = dx;
  if (view === "week") {
    const gw = centerWrap();
    if (gw) {
      const max = gw.scrollWidth - gw.clientWidth;
      if (gw.scrollLeft <= 1) { if (touch.baseL === null) touch.baseL = dx; } else touch.baseL = null;
      if (gw.scrollLeft >= max - 1) { if (touch.baseR === null) touch.baseR = dx; } else touch.baseR = null;
    }
    pull = 0;
    if (touch.baseL !== null && dx - touch.baseL > 0) pull = dx - touch.baseL;
    else if (touch.baseR !== null && dx - touch.baseR < 0) pull = dx - touch.baseR;
  }
  touch.dx = pull;
  const tr = trackEl(); if (tr) tr.style.transform = pos(pull);
}, { passive: true });
function endSwipe() {
  const s = touch; touch = null;
  if (!s || s.lock !== "x" || !s.dx) return;
  const dx = s.dx, W = viewEl.offsetWidth || 1, dir = dx < 0 ? 1 : -1;
  const speed = Math.abs(dx) / Math.max(1, Date.now() - s.t0);
  const commit = Math.abs(dx) > W * 0.25 || (speed > 0.5 && Math.abs(dx) > 30);
  if (commit) commitSlide(dir, dx, 200); else snapBack(dx);
}
viewEl.addEventListener("touchend", endSwipe, { passive: true });
viewEl.addEventListener("touchcancel", () => { const s = touch; touch = null; if (s && s.dx) snapBack(s.dx); }, { passive: true });

// Filter Chip Click Handling
$("filterLegend").addEventListener("click", e => {
  const chip = e.target.closest(".filter-chip");
  if (!chip) return;
  const k = chip.dataset.kind;
  filterState[k] = !filterState[k];
  store.set("tt-" + k, filterState[k] ? "1" : "0");
  applyFilters();
});

document.querySelectorAll("#zoneSeg button").forEach(b => b.onclick = () => { zonePref = b.dataset.z; store.set("tz-pref", zonePref); render(); });
$("loadbtn").onclick = $("pick").onclick = () => $("file").click();
$("file").onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  const text = await f.text(); store.set("ics-text", text); setPlan(text);
};
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  if (e.key === "ArrowLeft") $("prev").click();
  if (e.key === "ArrowRight") $("nextw").click();
});

async function load() {
  render();
  try {
    const r = await fetch("timetable.ics", { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    setPlan(await r.text());
  } catch (err) {
    const saved = store.get("ics-text");
    if (saved) { try { setPlan(saved); return; } catch (e2) {} }
    $("loader").hidden = false; renderNext();
  }
}
load();
let lastHour = Math.floor(Date.now() / H);
setInterval(() => { renderNext(); const h = Math.floor(Date.now() / H); if (h !== lastHour && !touch && !sliding) { lastHour = h; render(); } }, 60000);

// Prevent pinch-to-zoom on iOS Safari
document.addEventListener('gesturestart', function (e) {
  e.preventDefault();
});

// Prevent Ctrl / Cmd + wheel zoom on trackpads and desktop
document.addEventListener('wheel', function (e) {
  if (e.ctrlKey) {
    e.preventDefault();
  }
}, { passive: false });
</script>
</body>
</html>
